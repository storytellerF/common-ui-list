name: Build app

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.java'
      - '**/*.xml'
      - '**/*.gradle*'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build-on-ci.sh'
      - 'config/**'
      - '.github/workflows/test.yml'
      - '.github/workflows/build-app.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      storyteller_f_sign_key: ${{ secrets.SIGNING_KEY }}
      storyteller_f_sign_alias: ${{ secrets.ALIAS }}
      storyteller_f_sign_store_password: ${{ secrets.STORE_PASSWORD }}
      storyteller_f_sign_key_password: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Decode signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
        run: |
          KEYSTORE_PATH="$HOME/signing_key.jks"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "storyteller_f_sign_path=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Signed app bundle
          path: app/build/outputs/apk/release/app-release.apk
