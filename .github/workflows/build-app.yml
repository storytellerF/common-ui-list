name: Build app

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.java'
      - '**/*.xml'
      - '**/*.gradle*'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'config/**'
      - '.github/workflows/test.yml'
      - '.github/workflows/build-app.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      storyteller_f_sign_key: ${{ secrets.SIGNING_KEY }}
      storyteller_f_sign_alias: ${{ secrets.ALIAS }}
      storyteller_f_sign_store_password: ${{ secrets.STORE_PASSWORD }}
      storyteller_f_sign_key_password: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Decode signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
        run: |
          KEYSTORE_PATH="$HOME/signing_key.jks"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "storyteller_f_sign_path=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Signed app bundle
          path: app/build/outputs/apk/release/app-release.apk
